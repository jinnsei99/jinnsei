  { id: 'mono', name: '흑백', desc: '색을 빼고 또렷하게', bar: 0, color: ['#FFFFFF', '#000000'] }
];
const SKIN = Object.fromEntries(SKINS.map(k => [k.id, k]));
const skinId = v => (SKIN[v] ? v : 'default');

const MIN_WAGE = 10320; // 2026년 최저시급
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const LS_KEY = 'campus-gagyebu:v1';
const UI_KEY = 'campus-gagyebu:ui';
const MINUS = '−';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ================= 날짜 ================= */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parseYmd(s)) === s;
const isYm = s => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s);
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const addDays = (s, k) => { const d = parseYmd(s); d.setDate(d.getDate() + k); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const todayStr = () => ymd(new Date());
const curYm = () => todayStr().slice(0, 7);
const monthNum = ym => +ym.slice(5, 7);
const dayNum = s => +s.slice(8, 10);
const monthDoc = ym => 'm-' + ym;
const fmtMonth = ym => `${ym.slice(0, 4)}년 ${monthNum(ym)}월`;
const fmtMD = s => `${monthNum(s)}월 ${dayNum(s)}일`;
const wd = s => WEEK[parseYmd(s).getDay()];
const dueDate = (ym, day) => `${ym}-${pad(Math.min(day, daysIn(ym)))}`;

/* ================= 돈 ================= */
const won = n => Math.round(n).toLocaleString('ko-KR');
const trim1 = x => String(Math.round(x * 10) / 10);
function compact(n) {
  const a = Math.abs(Math.round(n));
  const s = n < 0 ? MINUS : '';
  if (a >= 1e8) return s + trim1(a / 1e8) + '억';
  if (a >= 1e6) return s + Math.round(a / 1e4).toLocaleString('ko-KR') + '만';
  if (a >= 1e4) return s + trim1(a / 1e4) + '만';
  return s + a.toLocaleString('ko-KR');
}
function tickLabel(v) {
  if (!v) return '0';
  if (v >= 1e4) return compact(v);
  if (v >= 1000 && v % 1000 === 0) return v / 1000 + '천';
  return won(v);
}
const parseAmount = s => {
  const d = String(s ?? '').replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
  return d ? Math.min(Number(d.slice(0, 10)), 9999999999) : 0;
};
function formatMoneyInput(el) {
  const digits = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 10);
  el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
}

/* ================= 상태 ================= */
const S = {
  mode: 'loading', // loading | cloud | local | memory
  note: '',
  docs: {}, // 문서 id → 원본 데이터 (settings, m-YYYY-MM)
  exists: new Set(),
  settings: null,
  rev: 0,
  definitive: false,
  col: null,
  unsub: null,
  downloads: null,
  syncError: false,
  readOnly: false
};
let markDefinitive;
const definitiveReady = new Promise(r => { markDefinitive = r; });

function defaultSettings() {
  return { budget: 0, catBudgets: {}, wage: MIN_WAGE, recurring: {}, since: null, exBudget: false, exCat: false, skin: 'default', startDay: 1, periodBudget: null };
}
S.settings = defaultSettings();

function normSettings(d) {
  const s = defaultSettings();
  if (!d || typeof d !== 'object') return s;
  if (Number.isFinite(d.budget) && d.budget > 0) s.budget = Math.round(d.budget);
  if (d.catBudgets && typeof d.catBudgets === 'object') {
    for (const [k, v] of Object.entries(d.catBudgets)) if (CAT[k] && CAT[k].type === 'out' && Number.isFinite(v) && v > 0) s.catBudgets[k] = Math.round(v);
  }
  if (Number.isFinite(d.wage) && d.wage > 0) s.wage = Math.round(d.wage);
  if (isYmd(d.since)) s.since = d.since;
  s.exBudget = !!d.exBudget;
  s.exCat = !!d.exCat;
  s.skin = skinId(d.skin);
  const sd = Math.round(Number(d.startDay));
  s.startDay = sd >= 1 && sd <= 28 ? sd : 1;
  const pb = d.periodBudget;
  if (pb && typeof pb === 'object' && isYm(pb.key) && isYmd(pb.from) && Number.isFinite(pb.amount) && pb.amount >= 0) {
    s.periodBudget = { key: pb.key, amount: Math.round(pb.amount), from: pb.from, base: Math.max(0, Math.round(Number(pb.base) || 0)) };
  }
  if (d.recurring && typeof d.recurring === 'object') {
    for (const [id, r] of Object.entries(d.recurring)) { const n = normRec(r, id); if (n) s.recurring[id] = n; }
  }
  return s;
}
function normRec(r, id) {
  if (!r || typeof r !== 'object') return null;
  const type = typeOf(r.type);
  const amount = Math.round(Number(r.amount));
  if (!Number.isFinite(amount) || amount <= 0) return null;
  const day = Math.min(31, Math.max(1, Math.round(Number(r.day)) || 1));
  const cat = CAT[r.cat] && CAT[r.cat].type === type ? r.cat : fallbackCat(type);
  const name = String(r.name || '').trim().slice(0, 20) || catOf(cat, type).name;
  return { id, type, name, cat, amount, day, last: isYm(r.last) ? r.last : null, on: r.on !== false, ex: !!r.ex, created: Number(r.created) || 0 };
}
function normTx(t, id) {
  if (!t || typeof t !== 'object' || !isYmd(t.date)) return null;
  const type = typeOf(t.type);
  const amount = Math.round(Number(t.amount));
  if (!Number.isFinite(amount) || (amount < 0 && type !== 'out')) return null;
  const cat = CAT[t.cat] && CAT[t.cat].type === type ? t.cat : fallbackCat(type);
  const sp = t.split;
  const split = sp && Number(sp.n) >= 2 && Number(sp.total) > 0 ? { total: Math.round(sp.total), n: Math.round(sp.n) } : null;
  return { id, type, amount, cat, date: t.date, memo: String(t.memo || '').slice(0, 60), split, rid: t.rid ? String(t.rid) : null, ex: !!t.ex, created: Number(t.created) || 0 };
}
const txDoc = t => ({ type: t.type, amount: t.amount, cat: t.cat, date: t.date, memo: t.memo || '', split: t.split || null, rid: t.rid || null, ex: !!t.ex, created: t.created || Date.now() });
const recDoc = r => ({ name: r.name, type: r.type, cat: r.cat, amount: r.amount, day: r.day, last: r.last || null, on: r.on !== false, ex: !!r.ex, created: r.created || Date.now() });

/* ================= 계산 (rev 단위 캐시) ================= */
const memo = new Map();
let memoRev = -1;
function cached(key, fn) {
  if (memoRev !== S.rev) { memo.clear(); memoRev = S.rev; }
  if (!memo.has(key)) memo.set(key, fn());
  return memo.get(key);
}
const cmpTx = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.created - a.created);
function allTx() {
  return cached('all', () => {
    const byId = new Map();
    for (const [docId, doc] of Object.entries(S.docs)) {
      if (!docId.startsWith('m-') || !doc || !doc.tx || typeof doc.tx !== 'object') continue;
      for (const [id, raw] of Object.entries(doc.tx)) {
        const t = normTx(raw, id);
        if (!t) continue;
        if (!byId.has(id) || monthDoc(t.date.slice(0, 7)) === docId) byId.set(id, t);
      }
    }
    return [...byId.values()].sort(cmpTx);
  });
}

/* 한 달 = 시작일부터 다음 달 시작일 전날까지. 기간 키는 시작하는 달(YYYY-MM) */
const startDay = () => (S.settings && S.settings.startDay) || 1;
const periodKeyFor = (date, sd) => (dayNum(date) >= sd ? date.slice(0, 7) : addMonths(date.slice(0, 7), -1));
const periodRangeFor = (key, sd) => [`${key}-${pad(sd)}`, addDays(`${addMonths(key, 1)}-${pad(sd)}`, -1)];
const periodKeyOf = date => periodKeyFor(date, startDay());
const periodRange = key => periodRangeFor(key, startDay());
const curKey = () => periodKeyOf(todayStr());
const periodTx = key => cached('p:' + key, () => {
  const [s, e] = periodRange(key);
  return allTx().filter(t => t.date >= s && t.date <= e);
});
function periodName(key) {
  if (startDay() === 1) return `${monthNum(key)}월`;
  const [s, e] = periodRange(key);
  return `${monthNum(s)}/${dayNum(s)}~${monthNum(e)}/${dayNum(e)}`;
}
function periodTitle(key) {
  if (startDay() === 1) return fmtMonth(key);
  const [s, e] = periodRange(key);
  return `${monthNum(s)}월 ${dayNum(s)}일 ~ ${monthNum(e)}월 ${dayNum(e)}일`;
}
const periodShort = key => (startDay() === 1 ? `${monthNum(key)}월` : `${monthNum(key)}/${startDay()}`);
const sumBy = (list, type) => list.reduce((s, t) => (t.type === type ? s + t.amount : s), 0);
function catSums(list, type) {
  const o = {};
  for (const t of list) if (t.type === type) o[t.cat] = (o[t.cat] || 0) + t.amount;
  return o;
}
const hasExamples = () => cached('hasEx', () =>
  allTx().some(t => t.ex) || Object.values(S.settings.recurring).some(r => r.ex) || S.settings.exBudget || S.settings.exCat);
function startDate() {
  return cached('start', () => {
    let first = S.settings.since || null;

    return first;

}
const spendDates = () => cached('spendDates', () => {
  const s = new Set();
  for (const t of allTx()) if (t.type === 'out' && t.amount > 0 && !isFixed(t)) s.add(t.date);
  return s;
});

function upcomingRecurring(key, today) {
  const end = periodRange(key)[1];
  const out = [];
  for (const r of Object.values(S.settings.recurring)) {
    if (!r.on) continue;
    for (let m = today.slice(0, 7); m <= end.slice(0, 7); m = addMonths(m, 1)) {
      if (r.last && r.last >= m) continue;
      const date = dueDate(m, r.day);
      if (date > today && date <= end) out.push({ ...r, date });
    }
  }
  return out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

/* 지금 기간의 지출 합계 (오늘 전 · 오늘 · 미리 적은 날) */
function spentSplit(key, today) {
  let before = 0, now = 0, future = 0;
  for (const t of periodTx(key)) {
    if (t.type !== 'out') continue;
    if (t.date < today) before += t.amount;
    else if (t.date === today) now += t.amount;
    else future += t.amount;
  }
  return { before, now, future };
}
function budgetInfo() {
  const today = todayStr(), key = periodKeyOf(today);
  const [start, end] = periodRange(key);
  const dim = daysBetween(start, end) + 1, day = daysBetween(start, today) + 1;
  const { before: spentBefore, now: spentToday, future: spentFuture } = spentSplit(key, today);
  const upcoming = upcomingRecurring(key, today).filter(r => r.type === 'out');
  const upcomingFixed = upcoming.reduce((s, r) => s + r.amount, 0);
  const pb = S.settings.periodBudget && S.settings.periodBudget.key === key ? S.settings.periodBudget : null;
  const budget = pb ? pb.amount : S.settings.budget;
  const remainingDays = dim - day + 1;
  const pool = budget - spentBefore - spentFuture - upcomingFixed;
  const daily = Math.max(0, Math.floor(pool / remainingDays));
  const spent = spentBefore + spentToday + spentFuture;
  // 계획: 오늘까지 쓰면 딱 맞는 금액. 남은 돈으로 시작한 달은 시작한 날부터 고르게 나눈다
  let plan;
  if (pb) {
    const span = Math.max(1, daysBetween(pb.from, end) + 1);
    const done = Math.min(span, Math.max(0, daysBetween(pb.from, today) + 1));
    plan = pb.base + (budget - pb.base) * done / span;
  } else {
    plan = budget * day / dim;
  }
  plan = Math.round(plan);
  return {
    today, key, ym: key, start, end, dim, day, budget, override: pb, spentBefore, spentToday, spentFuture, upcoming, upcomingFixed,
    remainingDays, daily, todayLeft: daily - spentToday, spent, left: budget - spent, plan, pace: budget ? Math.min(1, plan / budget) : day / dim
  };
}
/* '지금 남은 돈'으로 이번 기간 예산을 맞춘다 */
function makePeriodBudget(left, sd) {
  const today = todayStr(), key = periodKeyFor(today, sd);
  const [start, end] = periodRangeFor(key, sd);
  let before = 0, now = 0;
  for (const t of allTx()) {
    if (t.type !== 'out' || t.date < start || t.date > end) continue;
    if (t.date < today) before += t.amount;
    else if (t.date === today) now += t.amount;
  }
  return { key, amount: Math.max(0, left + before + now), from: today, base: Math.max(0, before) };
}

function noSpend(key) {
  const today = todayStr();
  const [start, end] = periodRange(key);
  const first = startDate();
  const spend = spendDates();
  const days = [];
  let count = 0;
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const st = d > today ? 'future' : !first || d < first ? 'none' : spend.has(d) ? 'spent' : 'free';

  }
  return { days, count };
}
function streakNow() {
  const first = startDate();
  if (!first) return 0;
  const spend = spendDates();
  let d = todayStr(), n = 0;
  while (d >= first && !spend.has(d) && n < 1000) { n++; d = addDays(d, -1); }
  return n;
}

/* ================= 저장소 ================= */
function refresh() {
  S.settings = normSettings(S.docs.settings);
  S.rev++;
  if (S.mode !== 'loading') applySkin(S.settings.skin);
  render();
}

function mergeDeep(base, patch) {
  const out = base && typeof base === 'object' && !Array.isArray(base) ? { ...base } : {};
  for (const [k, v] of Object.entries(patch)) {
    const cur = out[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && cur && typeof cur === 'object' && !Array.isArray(cur)) out[k] = mergeDeep(cur, v);
    else out[k] = v;
  }
  return out;
}
function cleanDoc(d) {
  const out = { ...d };
  for (const key of ['tx', 'recurring', 'catBudgets']) {
    if (out[key] && typeof out[key] === 'object') out[key] = Object.fromEntries(Object.entries(out[key]).filter(([, v]) => v !== null && v !== undefined));
  }
  return out;
}

const chains = {};
function queue(key, fn) {
  const p = (chains[key] || Promise.resolve()).catch(() => {}).then(fn);
  chains[key] = p;
  return p;
}
async function retryOnce(fn) {
  try { return await fn(); } catch (e) {
    if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 800); return fn(); }
    throw e;
  }
}
function writeDoc(id, patch) {
  return queue(id, async () => {
    await definitiveReady;
    const ref = S.col.doc(id);
    if (S.exists.has(id)) {
      await retryOnce(() => ref.update(patch));
    } else {
      await retryOnce(() => ref.set(cleanDoc(S.docs[id] || patch)));
      S.exists.add(id);
    }
  });
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return {};
    const d = JSON.parse(raw);
    return d && typeof d === 'object' && d.docs && typeof d.docs === 'object' ? d.docs : {};
  } catch (e) { return null; }
}
function saveLocal() {
  if (S.mode !== 'local') return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 1, docs: S.docs, savedAt: Date.now() })); }
  catch (e) { toast('이 브라우저에 저장하지 못했어요. 설정에서 백업 파일을 받아 두세요.', { kind: 'error' }); }
}

async function persist(ids, patches) {
  if (S.mode === 'local') return saveLocal();
  if (S.mode !== 'cloud') return;
  await Promise.all(ids.map(id => writeDoc(id, patches[id])));
}

function onWriteError(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') {
    toast('저장 공간이 가득 찼어요. 백업 파일을 받은 뒤 오래된 기록을 지워 주세요.', { kind: 'error' });
  } else if (code === 'invalid_argument' && S.mode === 'cloud' && !S.wroteOnce) {
    fallToLocal('readonly');
    toast('이 링크에서는 계정에 저장할 수 없어서 이 기기에 저장할게요.');
  } else if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
    S.readOnly = true;
    render();
  } else {
    toast('저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.', { kind: 'error' });
  }
}

/* 변경 하나를 적용하고 저장한다. ch: { put, del, settings, rec, recLast } */
async function commit(ch) {
  if (S.mode === 'loading') return false;
  if (S.readOnly) { toast('지금은 저장할 수 없어요. 페이지를 새로 열어 주세요.', { kind: 'error' }); return false; }
  const patches = {};
  const txPatch = (docId, id, val) => { ((patches[docId] ||= {}).tx ||= {})[id] = val; };
  for (const t of ch.del || []) txPatch(monthDoc(t.date.slice(0, 7)), t.id, null);
  for (const t of ch.put || []) {
    if (t.prevDate && t.prevDate.slice(0, 7) !== t.date.slice(0, 7)) txPatch(monthDoc(t.prevDate.slice(0, 7)), t.id, null);
    txPatch(monthDoc(t.date.slice(0, 7)), t.id, txDoc(t));
  }
  if (ch.settings || ch.rec || ch.recLast) {
    const p = { ...(ch.settings || {}) };
    if (ch.rec || ch.recLast) {
      p.recurring = {};
      for (const [id, r] of Object.entries(ch.rec || {})) p.recurring[id] = r ? recDoc(r) : null;
      for (const [id, m] of Object.entries(ch.recLast || {})) if (p.recurring[id] !== null) p.recurring[id] = { ...(p.recurring[id] || {}), last: m };
    }
    patches.settings = p;
  }
  const ids = Object.keys(patches);
  if (!ids.length) return true;
  for (const id of ids) S.docs[id] = mergeDeep(S.docs[id], patches[id]);
  refresh();
  try {
    await persist(ids, patches);
    S.wroteOnce = true;
    return true;
  } catch (e) {
    onWriteError(e);
    return false;
  }
}

/* 문서 전체를 바꾼다 (백업 불러오기, 모두 지우기) */
async function replaceAll(newDocs) {
  const old = Object.keys(S.docs);
  S.docs = newDocs;
  refresh();
  if (S.mode === 'local') { saveLocal(); return true; }
  if (S.mode !== 'cloud') return true;
  try {
    await definitiveReady;
    const jobs = [];
    for (const id of old) if (!(id in newDocs)) jobs.push(queue(id, async () => { await retryOnce(() => S.col.doc(id).delete()); S.exists.delete(id); }));
    for (const [id, d] of Object.entries(newDocs)) jobs.push(queue(id, async () => { await retryOnce(() => S.col.doc(id).set(d)); S.exists.add(id); }));
    await Promise.all(jobs);
    return true;
  } catch (e) {
    onWriteError(e);
    return false;
  }
}

/* 고정 수입·지출 자동 기록 */
let autoBusy = false;
async function autoPost() {
  if (autoBusy || S.readOnly || !S.definitive || S.mode === 'loading') return;
  const today = todayStr(), cur = today.slice(0, 7);
  const put = [], recLast = {};
  for (const r of Object.values(S.settings.recurring)) {
    if (!r.on) continue;
    let m = r.last ? addMonths(r.last, 1) : cur;
    for (let guard = 0; m <= cur && guard < 24; guard++) {
      const date = dueDate(m, r.day);
      if (date > today) break;
      put.push({ id: `r-${r.id}-${m}`, type: r.type, amount: r.amount, cat: r.cat, date, memo: r.name, split: null, rid: r.id, ex: r.ex, created: Date.now() });
      recLast[r.id] = m;
      m = addMonths(m, 1);
    }
  }
  if (!put.length) return;
  autoBusy = true;
  try {
    const ok = await commit({ put, recLast });
    if (ok) toast(`고정 수입·지출 ${put.length}건을 자동으로 적었어요`);
  } finally {
    autoBusy = false;
  }
}

/* 연결: Claude 계정 저장소 → 안 되면 이 기기 */
function startLocal(reason) {
  S.note = reason;
  const docs = loadLocal();
  if (docs === null) { S.mode = 'memory'; S.docs = {}; }
  else { S.mode = 'local'; S.docs = docs; }
  S.definitive = true;
  markDefinitive();
  refresh();
  autoPost();
}
function fallToLocal(reason) {
  if (S.unsub) { try { S.unsub(); } catch (e) { /* 무시 */ } S.unsub = null; }
  const current = S.docs;
  S.note = reason;
  const docs = loadLocal();
  if (docs === null) { S.mode = 'memory'; S.docs = current; refresh(); return; }
  for (const [id, d] of Object.entries(current)) docs[id] = mergeDeep(docs[id], d);
  S.mode = 'local';
  S.docs = docs;
  saveLocal();
  refresh();
}
function onSnap(snap) {
  const docs = {}, ex = new Set();
  for (const d of snap.docs) {
    if (!d.exists) continue;
    docs[d.id] = d.data();
    ex.add(d.id);
  }
  S.docs = docs;
  S.exists = ex;
  S.syncError = false;
  if (S.mode === 'loading') S.mode = 'cloud';
  if (!snap.metadata || !snap.metadata.fromCache) {
    if (!S.definitive) { S.definitive = true; markDefinitive(); }
  }
  refresh();
  if (S.definitive) autoPost();

function subscribe() {
  S.unsub = S.col.onSnapshot(onSnap, err => {
    if (err && err.code === 'unavailable' && !resubscribed) {
      resubscribed = true;
      setTimeout(subscribe, 1500);
      return;
    }
    S.syncError = true;
    if (err && err.code === 'revoked') S.readOnly = true;
    render();
  });
}
async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return startLocal('standalone');
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { /* 아래에서 처리 */ }
  c.use('downloads').then(d => { S.downloads = d; }, () => {});
  if (!db || !user) return startLocal('nodb');
  let uid = null;
  try { uid = await user.id(); } catch (e) { /* 무시 */ }
  if (!uid) return startLocal('signedout');
  let canWrite = null;
  try { canWrite = await user.can('data.write'); } catch (e) { /* 무시 */ }
  if (canWrite === false) return startLocal('readonly');
  try {
    S.col = db.collection('data/users/' + uid);
    subscribe();
  } catch (e) {
    startLocal('nodb');
  }
}

    h += `<div class="note" role="note"><p><b>예시 데이터</b>가 들어 있어요. 둘러본 뒤 지우고 내 가계부를 시작하세요.</p><button type="button" class="btn small" data-action="clear-examples">예시 지우기</button></div>`;
  }
  if (ui.tab === 'home' && needsBackup()) {
    const st = backupState();
    const when = st.last ? `마지막 백업은 ${daysBetween(st.last, todayStr())}일 전이에요.` : '아직 백업한 적이 없어요.';
    h += `<div class="note" role="note"><p><b>백업할 때가 됐어요.</b> 이 기록은 이 휴대폰에만 있어요. ${when}</p>
      <div class="note-actions"><button type="button" class="btn small" data-action="export-json">백업 받기</button><button type="button" class="btn small" data-action="backup-later">나중에</button></div></div>`;
  }
  if (S.syncError) h += `<div class="note warn" role="alert"><p>저장소 연결이 끊겼어요. 페이지를 새로 열어 주세요.</p></div>`;
  if (S.mode === 'memory') h += `<div class="note warn" role="alert"><p>이 브라우저는 저장을 막고 있어요. 창을 닫으면 기록이 사라져요.</p></div>`;
  return h;
}
/* 금액 표시: 수입 +, 지출 −, 저축은 부호 없이, 환불(음수 지출)은 + */
function signedWon(n, type) {
  if (type === 'save') return won(n);
  if (type === 'in') return '+' + won(n);
  return n < 0 ? '+' + won(-n) : MINUS + won(n);
}
const amountCls = t => (t.type === 'out' && t.amount < 0 ? 'refund' : t.type);
function txRow(t, opt = {}) {
  const c = catOf(t.cat, t.type);
  const title = t.memo || c.name;
  const sub = [];
  if (opt.date) sub.push(`<span>${fmtMD(t.date)}</span>`);
  sub.push(`<span${sub.length ? ' class="dot"' : ''}>${t.type === 'save' ? '저축 · ' : ''}${esc(c.name)}</span>`);
  if (t.split) sub.push(`<span class="dot">N빵 ${t.split.n}명 (총 ${won(t.split.total)}원)</span>`);
  if (t.rid) sub.push('<span class="dot">고정</span>');
  if (t.type === 'out' && t.amount < 0) sub.push('<span class="tag">환불</span>');
  if (t.ex) sub.push('<span class="tag">예시</span>');
  return `<li><button type="button" class="tx" data-action="edit-tx" data-id="${esc(t.id)}">
    <span class="ico" aria-hidden="true">${c.emoji}</span>
    <span class="tx-main"><span class="tx-title">${esc(title)}</span><span class="tx-sub">${sub.join('')}</span></span>
    <span class="tx-amt ${amountCls(t)}">${signedWon(t.amount, t.type)}<small>원</small></span>
  </button></li>`;
}
function dayTitle(s, withMonth = false) {
  const t = todayStr();
  const rel = s === t ? '오늘 · ' : s === addDays(t, -1) ? '어제 · ' : '';
  const y = s.slice(0, 4) !== t.slice(0, 4) ? `${s.slice(0, 4)}년 ` : '';
  return `${rel}${withMonth || startDay() !== 1 ? `${y}${monthNum(s)}월 ` : ''}${dayNum(s)}일 ${wd(s)}요일`;
}
function sum3(key, labels = ['들어온 돈', '나간 돈', '남은 돈']) {
  const list = periodTx(key);
  const inc = sumBy(list, 'in'), out = sumBy(list, 'out'), sav = sumBy(list, 'save'), net = inc - out - sav;
  const outText = out > 0 ? MINUS + won(out) : out < 0 ? '+' + won(-out) : '0';
  return `<div class="sum3">
    <div><span>${labels[0]}</span><b class="pos">+${won(inc)}</b></div>
    <div><span>${labels[1]}</span><b class="${out > 0 ? 'out' : ''}">${outText}</b></div>
    <div><span>${labels[2]}</span><b class="${net < 0 ? 'neg' : ''}">${net < 0 ? MINUS : ''}${won(Math.abs(net))}</b></div>
  </div>${sav ? `<p class="sum-note">🏦 저축 ${won(sav)}원은 지출에 넣지 않고, ${labels[2]}에서만 뺐어요.</p>` : ''}`;
}
function monthNav() {

function heroHtml(b) {
  const monthOver = b.left < 0;
  const num = monthOver ? b.left : b.todayLeft;
  const neg = num < 0;
  const label = monthOver ? '이번 달 예산을 넘었어요' : '오늘 쓸 수 있는 돈';
  let sub;
  if (monthOver) sub = `이번 달 예산 ${won(b.budget)}원보다 <b>${won(-b.left)}원</b> 더 썼어요`;
  else if (!b.spentToday) sub = `남은 ${b.remainingDays}일 동안 하루 <b>${won(b.daily)}원</b>씩 쓸 수 있어요`;
  else if (neg) sub = `하루 예산 ${won(b.daily)}원보다 <b>${won(-b.todayLeft)}원</b> 더 썼어요`;
  else sub = `하루 예산 ${won(b.daily)}원 중 <b>${won(b.spentToday)}원</b> 썼어요`;
  const pct = b.budget ? Math.max(0, b.spent) / b.budget : 0;
  const plan = b.plan;
  let st;
  if (b.spent > b.budget) st = ['bad', '✕', `예산을 ${won(b.spent - b.budget)}원 넘었어요`];
  else if (b.spent > plan) st = ['warn', '!', `계획보다 ${won(b.spent - plan)}원 빨리 쓰고 있어요`];
  else st = ['good', '✓', plan > b.spent ? `계획보다 ${won(plan - b.spent)}원 아꼈어요` : '계획대로 쓰고 있어요'];
  const notes = [];
  if (b.upcomingFixed) notes.push(`곧 나갈 고정지출 ${won(b.upcomingFixed)}원(${b.upcoming.length}건)`);
  if (b.spentFuture > 0) notes.push(`미리 적어 둔 지출 ${won(b.spentFuture)}원`);
  const sweep = heroSwept ? '' : ' sweep';
  heroSwept = true;
  return `<section class="hero card${sweep}" aria-labelledby="heroLabel">
    <p class="eyebrow" id="heroLabel">${label}</p>
    <p class="hero-num"><span class="hl${neg ? ' over' : ''}">${neg ? MINUS : ''}${won(Math.abs(num))}</span><span class="unit">원</span></p>
    <p class="hero-sub">${sub}</p>
    <div class="meter">
      <div class="meter-track" role="img" aria-label="이번 달 예산 ${won(b.budget)}원 중 ${won(Math.max(0, b.spent))}원 사용. 오늘까지 계획 ${won(plan)}원">
        <span class="meter-fill ${st[0]}" style="width:${Math.min(100, pct * 100).toFixed(2)}%"></span>
        <span class="meter-pace" style="left:${(b.pace * 100).toFixed(2)}%"></span>
      </div>
      <div class="meter-row"><span>${periodName(b.key)} <b>${won(Math.max(0, b.spent))}</b> / ${won(b.budget)}원</span><span>${Math.round(pct * 100)}%</span></div>
      <div class="meter-row"><span class="st ${st[0]}"><i aria-hidden="true">${st[1]}</i>${st[2]}</span><span class="pace-key"><i aria-hidden="true"></i>오늘까지 계획 ${won(plan)}원</span></div>
    </div>
    ${notes.length ? `<p class="hero-foot">${notes.join(', ')}은 미리 뺐어요.</p>` : ''}
    ${b.override ? `<p class="hero-foot">이번 달은 ${fmtMD(b.override.from)}에 남은 돈으로 맞춰서 시작했어요. ${S.settings.budget ? `다음 달부터는 월 예산 ${won(S.settings.budget)}원으로 계산해요.` : '다음 달 예산은 설정에서 정해 주세요.'}</p>` : ''}
  </section>`;
}

/* 이번 주 월요일부터 일요일까지 */
function weekDays() {
  const t = todayStr();
  const mon = addDays(t, -((parseYmd(t).getDay() + 6) % 7));
  return Array.from({ length: 7 }, (_, i) => addDays(mon, i));
}
function noSpendHtml(key) {
  const ns = noSpend(key);
  const today = todayStr();
  const first = startDate();
  const spend = spendDates();
  const streak = streakNow();
  const todaySpent = spend.has(today);
  let text;
  if (!first) text = '지출을 기록하면 무지출 날을 세어 드려요';
  else if (streak > 0) text = `<b>${streak}일째</b> 무지출 이어가는 중`;
  else if (todaySpent) text = '오늘은 지출이 있었어요. 내일 다시 도전!';
  else text = '고정지출 말고 한 푼도 안 쓴 날을 세요';
  const days = weekDays().map(ds => {
    const st = ds > today ? 'future' : !first || ds < first ? 'none' : spend.has(ds) ? 'spent' : 'free';
    const label = `${monthNum(ds)}월 ${dayNum(ds)}일 ${wd(ds)}요일${st === 'free' ? ', 무지출' : st === 'spent' ? ', 지출 있음' : ''}${ds === today ? ', 오늘' : ''}`;
    return `<li class="${st}${ds === today ? ' today' : ''}" aria-label="${label}"><span class="wk-d" aria-hidden="true">${wd(ds)}</span><span class="wk-n" aria-hidden="true">${dayNum(ds)}</span></li>`;
  }).join('');
  return `<section class="sec card" aria-labelledby="nsTitle">
    <div class="sec-head"><h2 id="nsTitle">무지출 챌린지</h2><span class="muted">${periodName(key)}</span></div>
    <div class="ns"><p class="ns-big">${ns.count}<small>일</small></p><p class="ns-text">${text}</p></div>
    <ol class="week" aria-label="이번 주 무지출">${days}</ol>
    <p class="legend"><span><i class="k free"></i>무지출</span><span><i class="k spent"></i>쓴 날</span><span>고정지출(자동 기록·주거·통신·구독)은 빼고 세요</span></p>
  </section>`;
}

function catHomeHtml(b) {
  const caps = S.settings.catBudgets;
  const spent = catSums(periodTx(b.key), 'out');
  const keys = Object.keys(caps);
  if (keys.length) {
    const rows = keys.map(k => ({ k, s: spent[k] || 0, cap: caps[k] })).sort((x, y) => y.s / y.cap - x.s / x.cap);
    return `<section class="sec card" aria-labelledby="cbTitle">
      <div class="sec-head"><h2 id="cbTitle">카테고리 예산</h2><button type="button" class="link" data-action="goto-settings">바꾸기</button></div>
      <ul class="rank">${rows.map(r => {
        const c = CAT[r.k], ratio = Math.max(0, r.s) / r.cap;
        let st = '';
        let cls = '';
        if (ratio > 1) { cls = 'bad'; st = `<span class="st bad"><i aria-hidden="true">✕</i>${won(r.s - r.cap)}원 넘었어요</span>`; }
        else if (ratio >= 0.8) { cls = 'warn'; st = `<span class="st warn"><i aria-hidden="true">!</i>${won(r.cap - r.s)}원 남았어요</span>`; }
        return `<li><button type="button" class="rank-btn" data-action="goto-cat" data-cat="${r.k}" data-month="${b.key}">
          <span class="ico" aria-hidden="true">${c.emoji}</span>
          <span class="rank-name">${esc(c.name)}</span>
          <span class="rank-val">${won(Math.max(0, r.s))}<small>/ ${won(r.cap)}원</small></span>
          <span class="rank-meta"><span class="bar"><i class="${cls}" style="width:${Math.min(100, ratio * 100).toFixed(1)}%"></i></span>${st}</span>
        </button></li>`;
      }).join('')}</ul>
    </section>`;
  }
  const rows = Object.entries(spent).filter(([, v]) => v > 0).sort((x, y) => y[1] - x[1]).slice(0, 3);
  if (!rows.length) return '';
  const max = rows[0][1];
  const total = Object.values(spent).filter(v => v > 0).reduce((a, v) => a + v, 0);
  return `<section class="sec card" aria-labelledby="topTitle">
    <div class="sec-head"><h2 id="topTitle">많이 쓴 곳</h2><button type="button" class="link" data-action="goto-settings">카테고리 예산 정하기</button></div>
    <ul class="rank">${rows.map(([k, v]) => `<li><button type="button" class="rank-btn" data-action="goto-cat" data-cat="${k}" data-month="${b.key}">
      <span class="ico" aria-hidden="true">${CAT[k].emoji}</span>
      <span class="rank-name">${esc(CAT[k].name)}</span>
      <span class="rank-val">${won(v)}원<small>${Math.round((v / total) * 100)}%</small></span>
      <span class="rank-meta"><span class="bar"><i style="width:${((v / max) * 100).toFixed(1)}%"></i></span></span>
    </button></li>`).join('')}</ul>
  </section>`;
}

}

const searching = () => !!ui.q.trim();
const searchAll = () => searching() && ui.qAll;
function filteredList() {
  let list = searchAll() ? allTx() : periodTx(ui.month);
  if (ui.fType !== 'all') list = list.filter(t => t.type === ui.fType);

function viewStats() {
  const key = ui.month, today = todayStr(), cur = curKey();
  const isCur = key === cur, isFuture = key > cur;
  const [start, end] = periodRange(key);
  const list = periodTx(key);
  const out = sumBy(list, 'out'), inc = sumBy(list, 'in');
  const elapsed = isFuture ? 0 : isCur ? daysBetween(start, today) + 1 : daysBetween(start, end) + 1;
  const pkey = addMonths(key, -1), plist = periodTx(pkey);
  let prevOut, cmpLabel;
  if (isCur) {
    const cutoff = addDays(periodRange(pkey)[0], elapsed - 1);
    prevOut = sumBy(plist.filter(t => t.date <= cutoff), 'out');
    cmpLabel = '지난달 이맘때';
  } else {
    prevOut = sumBy(plist, 'out');
    cmpLabel = '지난달';
  }
  const diff = out - prevOut;

    else if (diff > 0) delta = `<p class="delta bad"><span aria-hidden="true">▲</span>${cmpLabel}보다 ${won(diff)}원 더 썼어요</p>`;
    else delta = `<p class="delta flat">${cmpLabel}와 똑같이 썼어요</p>`;
  }

  </section>`;
  h += `<div class="kpis">
    <div><span>하루 평균</span><b>${elapsed ? won(Math.round(Math.max(0, out) / elapsed)) : 0}원</b></div>
    <div><span>들어온 돈</span><b>${won(inc)}원</b></div>

  h += catCard(key, list);

}

function niceTicks(max, count = 3) {

  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const top = Math.ceil(max / step) * step;

  return out;
}
function roundTop(x, y, w, h, r) {

  return `M${x},${y + h}V${y + r}a${r},${r} 0 0 1 ${r},${-r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}V${y + h}Z`;
}

  const ticks = niceTicks(maxV, 3);
  const top = ticks[ticks.length - 1];
  const y = v => M.t + ih - (v / top) * ih;
  const n = spec.data.length, band = iw / n;
  const bw = Math.max(2, Math.min(24, band - 2, band * 0.62 + (n > 12 ? band * 0.2 : 0)));
  const base = M.t + ih;
  let g = '';
  for (const t of ticks) {
    const yy = Math.round(y(t)) + 0.5;
    if (t) g += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="ytick" x="${M.l - 7}" y="${yy + 3.5}" text-anchor="end">${tickLabel(t)}</text>`;
  }
  g += `<rect class="band" x="0" y="${M.t - 6}" width="${band}" height="${ih + 6}" rx="6" visibility="hidden"/>`;
  spec.data.forEach((d, i) => {
    if (!(d.v > 0)) return;

  const vlabels = (spec.labels || []).filter(i => spec.data[i] && spec.data[i].v > 0).map(i => {
    const d = spec.data[i], txt = compact(d.v), w = textW(txt, 12);

function wireTip(host, spec, geo) {

  for (const b of $$('#txForm [data-date-q]')) b.setAttribute('aria-pressed', String(addDays(today, Number(b.dataset.dateQ)) === d));

function updateSplitInfo() {

function quickPicks(type) {
  const since = addDays(todayStr(), -90);
  const m = new Map();
  for (const t of allTx()) {
    if (t.type !== type || t.rid || t.split || t.amount <= 0 || t.date < since) continue;
    const memoText = t.memo.trim();
    if (!memoText) continue;
    const k = `${t.cat}|${memoText}|${t.amount}`;
    const e = m.get(k) || { cat: t.cat, memo: memoText, amount: t.amount, n: 0, last: '' };
    e.n++;
    if (t.date > e.last) e.last = t.date;
    m.set(k, e);
  }
  return [...m.values()].filter(e => e.n >= 2).sort((a, b) => b.n - a.n || (a.last < b.last ? 1 : -1)).slice(0, 8);
}
function renderPicks() {
  T.picks = T.edit ? [] : quickPicks(T.type);
  $('#quickWrap').hidden = !T.picks.length;
  $('#quick').innerHTML = T.picks.map((p, i) =>
    `<button type="button" class="chip" data-qp="${i}"><span aria-hidden="true">${CAT[p.cat].emoji}</span>${esc(p.memo)} <b>${won(p.amount)}</b></button>`).join('');
}
function renderMemoList() {
  const counts = new Map();
  for (const t of allTx()) {
    if (t.type !== T.type || !t.memo || (T.cat && t.cat !== T.cat)) continue;
    counts.set(t.memo, (counts.get(t.memo) || 0) + 1);
  }
  $('#memoList').innerHTML = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([v]) => `<option value="${esc(v)}"></option>`).join('');
}
/* 입력을 읽어 저장할 기록을 만든다. 잘못된 칸이 있으면 알려 주고 null */
function readTx() {
  const err = $('#txErr');
  const raw = parseAmount($('#f-amount').value);
  const date = $('#f-date').value;
  const memoText = $('#f-memo').value.trim().slice(0, 40);
  if (!raw) { err.textContent = '금액을 넣어 주세요.'; pointTo($('#f-amount')); return null; }
  if (!T.cat) { err.textContent = '카테고리를 골라 주세요.'; const b = $('#catGrid .cat-btn'); if (b) b.focus(); return null; }
  if (!isYmd(date)) { err.textContent = '날짜를 다시 골라 주세요.'; pointTo($('#f-date')); return null; }
  let amount = raw, split = null;
  if (T.type === 'out' && T.refund) amount = -raw; // 환불은 지출에서 빼는 음수 금액
  else if (T.type === 'out' && T.split) { split = { total: raw, n: T.n }; amount = Math.ceil(raw / T.n); }
  const prev = T.edit;
  const tx = {
    id: prev ? prev.id : newId('t'), type: T.type, amount, cat: T.cat, date, memo: memoText, split,
    rid: prev ? prev.rid : null, ex: prev ? prev.ex : false, created: prev ? prev.created : Date.now(), prevDate: prev ? prev.date : null
  };
  const ch = { put: [tx] };
  const wage = parseAmount($('#f-wage').value);
  if (T.type === 'in' && T.cat === 'parttime' && parseFloat($('#f-hours').value) > 0 && wage && wage !== S.settings.wage) ch.settings = { wage };
  return { tx, ch };
}
function submitTx(e) {
  e.preventDefault();
  const got = readTx();
  if (!got) return;
  const { tx, ch } = got;
  const prev = T.edit;
  if (!prev) T.mem = { date: tx.date, at: Date.now() };
  txSheet.close();
  commit(ch).then(ok => {
    if (!ok) return;
    toast(prev ? '고쳤어요' : tx.date === todayStr() ? '기록했어요' : `${fmtMD(tx.date)}에 기록했어요`);
  });
}
/* 저장하고 시트를 그대로 둔 채 다음 기록 받기 (구분·날짜는 유지) */
function saveAndMore() {
  if (T.edit) return;

  const c = catOf(tx.cat, tx.type);

  done.textContent = `✓ ${tx.date === todayStr() ? '' : fmtMD(tx.date) + ' · '}${tx.memo || c.name} ${signedWon(tx.amount, tx.type)}원 저장했어요. 다음 기록을 적어 주세요.`;
  T.cat = null;

function syncRecNow() {
  const today = todayStr(), cur = today.slice(0, 7);
  const due = dueDate(cur, Number($('#r-day').value));
  const resuming = !!(R.edit && !R.edit.on && $('#r-on').checked);
  const fresh = !R.edit || (resuming && !(R.edit.last && R.edit.last >= cur));
  $('#r-now-row').hidden = !(fresh && due <= today);

  const today = todayStr(), cur = today.slice(0, 7), due = dueDate(cur, day);
  const prev = R.edit;
  const on = prev ? $('#r-on').checked : true;
  // last = 마지막으로 적은 달. 새로 시작할 때는 이번 달부터만 적고 지난달까지는 채우지 않는다
  const fromNow = () => (due <= today && !$('#r-now').checked ? cur : addMonths(cur, -1));
  let last;
  if (!prev) last = fromNow();
  else if (on && !prev.on) last = prev.last && prev.last >= cur ? prev.last : fromNow();
  else last = prev.last;
  const r = {
    id: prev ? prev.id : newId('r'), name, type: R.type, cat: CAT[cat] && CAT[cat].type === R.type ? cat : fallbackCat(R.type),

const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
function toCsv(list) {
  const head = ['날짜', '구분', '카테고리', '금액', '메모', 'N빵 총액', 'N빵 인원', '고정'];
  const rows = [...list].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.created - b.created)).map(t => [
    t.date, TYPE_NAME[t.type], catOf(t.cat, t.type).name, t.amount, t.memo,
    t.split ? t.split.total : '', t.split ? t.split.n : '', t.rid ? '예' : ''
  ]);
  return '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}
/* 파일을 건넨다. 저장·공유·복사 창까지 갔으면 true */
async function offerFile(filename, data, mime) {
  if (S.downloads) {
    try {
      await S.downloads.save({ filename, data });
      toast('파일을 저장했어요');
      return true;
    } catch (e) {
      if (e && (e.code === 'declined' || e.code === 'rate_limited')) return false;
    }
  }
  if (!window.claude) {
    try {
      const file = new File([data], filename, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer: coarse)').matches) {
        await navigator.share({ files: [file], title: filename });
        return true;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
    }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: mime }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    } catch (e) { /* 아래 복사로 */ }
  }
  showCopy(data);
  return true;
}
function exportCsv(scope) {

function parseBackup(text) {
  const d = JSON.parse(text);
  if (!d || typeof d !== 'object' || !d.docs || typeof d.docs !== 'object') throw new Error('shape');
  const docs = {}, txs = [];
  let settings = null;
  for (const [id, doc] of Object.entries(d.docs)) {
    if (!doc || typeof doc !== 'object') continue;
    if (id === 'settings') {
      const s = settings = normSettings(doc);
      const rec = {};
      for (const r of Object.values(s.recurring)) rec[r.id] = recDoc(r);
      docs.settings = {
        budget: s.budget, catBudgets: s.catBudgets, wage: s.wage, recurring: rec, since: s.since, exBudget: s.exBudget, exCat: s.exCat,
        skin: SKIN[doc.skin] ? doc.skin : S.settings.skin, startDay: s.startDay, periodBudget: s.periodBudget
      };
    } else if (/^m-\d{4}-(0[1-9]|1[0-2])$/.test(id) && doc.tx && typeof doc.tx === 'object') {
      const tx = {};
      for (const [tid, raw] of Object.entries(doc.tx)) {
        const t = normTx(raw, tid);
        if (t && monthDoc(t.date.slice(0, 7)) === id) { tx[tid] = txDoc(t); txs.push(t); }
      }
      docs[id] = { tx };
    }
  }
  return { docs, count: txs.length, txs, settings };
}
async function importFile(file) {

  catch (e) { toast('캠퍼스 가계부 백업 파일이 아니에요. 파일을 다시 골라 주세요.', { kind: 'error' }); return; }
  const have = allTx().length;
  let how;
  if (!have) {
    how = (await confirmBox({ title: '백업을 불러올까요?', body: `백업 파일의 기록 ${parsed.count}건과 예산·설정을 불러와요.`, ok: '불러오기' })) ? 'replace' : '0';
  } else {
    how = await chooseBox({
      title: '백업을 어떻게 불러올까요?',
      body: `백업 파일에 기록 ${parsed.count}건, 지금 가계부에 ${have}건이 있어요.\n· 합치기: 지금 기록은 그대로 두고 백업에만 있는 기록을 더해요. 예산과 설정은 지금 것을 써요.\n· 바꾸기: 지금 기록과 설정을 모두 지우고 백업으로 바꿔요.`,
      choices: [{ v: '0', label: '취소' }, { v: 'replace', label: '바꾸기', cls: 'danger' }, { v: 'merge', label: '합치기', cls: 'primary' }]
    });
  }
  if (how === 'merge') { await mergeBackup(parsed); return; }
  if (how !== 'replace') return;
  if (!parsed.docs.settings) parsed.docs.settings = { skin: S.settings.skin };
  if (await replaceAll(parsed.docs)) toast(`백업을 불러왔어요 (${parsed.count}건)`);

}
/* 합치기: 같은 id는 지금 것을 두고, 백업에만 있는 기록과 고정 항목을 더한다 */
async function mergeBackup(parsed) {
  const mine = allTx();
  const ids = new Set(mine.map(t => t.id));
  // 같은 고정 항목을 두 곳에서 따로 등록해 자동으로 적힌 기록은 한 번만
  const sig = t => `${t.date}|${t.type}|${t.amount}|${t.memo}`;
  const autoSigs = new Set(mine.filter(t => t.rid).map(sig));
  const put = parsed.txs.filter(t => !ids.has(t.id) && !(t.rid && autoSigs.has(sig(t)))).map(t => ({ ...t, prevDate: null }));
  const rec = {};
  if (parsed.settings) {
    const recSig = r => `${r.type}|${r.name}|${r.amount}|${r.day}`;
    const have = new Set(Object.values(S.settings.recurring).map(recSig));
    for (const r of Object.values(parsed.settings.recurring)) if (!S.settings.recurring[r.id] && !have.has(recSig(r))) rec[r.id] = r;
  }
  const nRec = Object.keys(rec).length;
  if (!put.length && !nRec) { toast('더할 기록이 없어요. 백업의 기록이 이미 모두 들어 있어요.'); return; }
  const ch = { put };
  if (nRec) ch.rec = rec;
  const parts = [put.length ? `기록 ${put.length}건` : '', nRec ? `고정 항목 ${nRec}개` : ''].filter(Boolean);
  if (await commit(ch)) toast(`${parts.join(', ')}${nRec ? '를' : '을'} 더했어요`);
  autoPost();
}

/* 시트 공통: 닫기 버튼, 바깥 누르면 닫기. 닫을 때도 아래로 미끄러지며 닫힌다 */
const nativeClose = HTMLDialogElement.prototype.close;
const nativeShowModal = HTMLDialogElement.prototype.showModal;
for (const d of $$('dialog.sheet')) {
  let closing = null; // { timer, onEnd }
  const stopClosing = () => {
    if (!closing) return;
    clearTimeout(closing.timer);
    d.removeEventListener('animationend', closing.onEnd);
    closing = null;
    d.classList.remove('closing');
  };
  // 모든 .close() 호출(저장, 삭제, 취소, 바깥 누르기)이 여기를 거친다
  d.close = function (rv) {
    if (!d.open || closing) return;
    if (reduceMotion.matches) { nativeClose.call(d, rv); return; }
    const finish = () => { stopClosing(); nativeClose.call(d, rv); };
    const onEnd = e => { if (e.target === d && !e.pseudoElement) finish(); };
    closing = { timer: setTimeout(finish, 400), onEnd }; // 애니메이션이 안 끝나는 경우 대비
    d.addEventListener('animationend', onEnd);
    d.classList.add('closing');
  };
  // 닫히는 중에 다시 열면 닫기를 멈추고 그대로 연다
  d.showModal = function () {
    stopClosing();
    if (!d.open) nativeShowModal.call(d);
  };
  // 실제로 닫히면(브라우저가 Esc로 바로 닫은 경우 포함) 닫는 중 표시를 지운다
  d.addEventListener('close', stopClosing);
  d.addEventListener('cancel', e => { e.preventDefault(); d.close(); });
  d.addEventListener('click', e => {
    if (e.target === d) d.close();
    else if (e.target.closest('[data-close]')) d.close();
  });
}

/* 휴대폰 앱으로 설치했을 때: 오프라인 캐시, 저장 공간 보호 (Claude 안에서는 쓰지 않음) */
if (!window.claude && 'serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (installed && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
})();
</script>
