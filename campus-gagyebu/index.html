function dailySub(ym) {
  const b = S.settings.budget;
  if (!b) return '점선 없이 그날 쓴 돈만 보여요. 예산을 정하면 하루 예산선이 생겨요.';
  const dim = daysIn(ym), ref = Math.round(b / dim);
  const daily = Array(dim).fill(0);
  for (const t of monthTx(ym)) if (t.type === 'out') daily[dayNum(t.date) - 1] += t.amount;
  const over = daily.filter(v => v > ref).length;
  return `점선은 하루 예산 ${won(ref)}원이에요. 이 선을 넘긴 날은 모두 <b>${over}일</b>이에요.`;
}
function dailySpec(ym) {
  const dim = daysIn(ym), arr = Array(dim).fill(0);
  for (const t of monthTx(ym)) if (t.type === 'out') arr[dayNum(t.date) - 1] += t.amount;
  const marks = new Set([1, 5, 10, 15, 20, 25, dim]);
  if (dim - 25 < 3) marks.delete(25);
  let mx = 0;
  arr.forEach((v, i) => { if (v > arr[mx]) mx = i; });
  const b = S.settings.budget, ref = b ? Math.round(b / dim) : 0;
  return {
    aria: `${monthNum(ym)}월 날짜별 지출 막대그래프. 가장 많이 쓴 날은 ${mx + 1}일 ${won(arr[mx])}원`,
    data: arr.map((v, i) => ({ v, xl: marks.has(i + 1) ? String(i + 1) : '', tipL: `${monthNum(ym)}월 ${i + 1}일 (${wd(`${ym}-${pad(i + 1)}`)})`, tipV: `${won(v)}원` })),
    labels: arr[mx] > 0 ? [mx] : [],
    ref: ref ? { v: ref, label: `하루 예산 ${compact(ref)}` } : null,
    tcols: ['날짜', '지출']
  };
}
function weekSpec(ym) {
  const today = todayStr(), cur = today.slice(0, 7);
  const end = ym === cur ? today : `${ym}-${pad(daysIn(ym))}`;
  const first = startDate();
  let from = addDays(end, -55);
  if (first && first > from) from = first;
  const sums = Array(7).fill(0), cnt = Array(7).fill(0);
  if (first && from <= end) {
    for (let d = from; d <= end; d = addDays(d, 1)) cnt[parseYmd(d).getDay()]++;
    for (const t of allTx()) if (t.type === 'out' && !t.rid && t.date >= from && t.date <= end) sums[parseYmd(t.date).getDay()] += t.amount;
  }
  const order = [1, 2, 3, 4, 5, 6, 0];
  const data = order.map(k => {
    const v = cnt[k] ? Math.round(sums[k] / cnt[k]) : 0;
    return { v, k, xl: WEEK[k], tipL: `${WEEK[k]}요일 평균`, tipV: `${won(v)}원` };
  });
  const days = cnt.reduce((a, b) => a + b, 0);
  let mx = 0;
  data.forEach((d, i) => { if (d.v > data[mx].v) mx = i; });
  let sub;
  if (days < 7 || !data[mx].v) sub = '기록이 일주일 넘게 쌓이면 어느 요일에 많이 쓰는지 알려 드려요.';
  else sub = `최근 ${Math.min(8, Math.ceil(days / 7))}주 기준, <b>${WEEK[data[mx].k]}요일</b>에 평균 ${won(data[mx].v)}원으로 가장 많이 써요. 고정지출은 뺐어요.`;
  return {
    sub,
    aria: `요일별 평균 지출 막대그래프. ${WEEK[data[mx].k]}요일이 가장 많아요`,
    data,
    emph: i => i === mx,
    emphX: mx,
    labels: data[mx].v ? [mx] : [],
    tcols: ['요일', '평균 지출'],
    tableAll: true
  };
}
function monthsSpec(ym) {
  const months = Array.from({ length: 6 }, (_, i) => addMonths(ym, i - 5));
  const data = months.map(m => {
    const v = sumBy(monthTx(m), 'out');
    return { v, xl: `${monthNum(m)}월`, tipL: `${fmtMonth(m)} 지출`, tipV: `${won(v)}원` };
  });
  let mx = 0;
  data.forEach((d, i) => { if (d.v > data[mx].v) mx = i; });
  const labels = [5];
  if (mx !== 5 && data[mx].v > 0) labels.push(mx);
  const b = S.settings.budget;
  return {
    aria: `최근 6개월 월별 지출 막대그래프. ${fmtMonth(ym)} ${won(data[5].v)}원`,
    data,
    emph: i => i === 5,
    emphX: 5,
    labels,
    ref: b ? { v: b, label: `월 예산 ${compact(b)}` } : null,
    tcols: ['달', '지출'],
    tableAll: true
  };
}

/* ================= 차트 ================= */
function niceTicks(max, count = 3) {
  const raw = max / count;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const top = Math.ceil(max / step) * step;
  const out = [];
  for (let v = 0; v <= top + step / 2; v += step) out.push(Math.round(v));
  return out;
}
function roundTop(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  if (!r) return `M${x},${y + h}V${y}h${w}V${y + h}Z`;
  return `M${x},${y + h}V${y + r}a${r},${r} 0 0 1 ${r},${-r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}V${y + h}Z`;
}
const textW = (str, size) => [...String(str)].reduce((w, ch) => w + (/[\u3131-\uD79D]/.test(ch) ? size : size * 0.6), 0);
function drawColumns(host, spec) {
  const W = Math.max(240, Math.floor(host.clientWidth));
  const H = spec.h || 180;
  const M = { t: 24, r: 6, b: 24, l: 38 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const maxV = Math.max(1, ...spec.data.map(d => d.v), spec.ref ? spec.ref.v : 0);
  const ticks = niceTicks(maxV, 3);
  const top = ticks[ticks.length - 1];
  const y = v => M.t + ih - (v / top) * ih;
  const n = spec.data.length, band = iw / n;
  const bw = Math.max(2, Math.min(24, band - 2, band * 0.62 + (n > 12 ? band * 0.2 : 0)));
  const base = M.t + ih;
  let g = '';
  for (const t of ticks) {
    const yy = Math.round(y(t)) + 0.5;
    if (t) g += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="ytick" x="${M.l - 7}" y="${yy + 3.5}" text-anchor="end">${tickLabel(t)}</text>`;
  }
  g += `<rect class="band" x="0" y="${M.t - 6}" width="${band}" height="${ih + 6}" rx="6" visibility="hidden"/>`;
  spec.data.forEach((d, i) => {
    if (!(d.v > 0)) return;
    const x = M.l + i * band + (band - bw) / 2, yy = y(d.v);
    const mute = spec.emph && !spec.emph(i) ? ' mute' : '';
    g += `<path class="bar-m${mute}" d="${roundTop(x, yy, bw, base - yy, ui.skin === 'excel' ? 0 : 4)}"/>`;
  });
  g += `<line class="base" x1="${M.l}" x2="${W - M.r}" y1="${base + 0.5}" y2="${base + 0.5}"/>`;
  const vlabels = (spec.labels || []).filter(i => spec.data[i] && spec.data[i].v > 0).map(i => {
    const d = spec.data[i], txt = compact(d.v), w = textW(txt, 11);
    const cx = Math.min(Math.max(M.l + i * band + band / 2, M.l + w / 2), W - M.r - w / 2);
    return { i, txt, cx, y: y(d.v) - 7, x0: cx - w / 2, x1: cx + w / 2 };
  });
  if (spec.ref && spec.ref.v > 0) {
    const yy = Math.round(y(spec.ref.v)) + 0.5;
    const ly = yy - 6, lw = textW(spec.ref.label, 11) + 4;
    g += `<line class="ref" x1="${M.l}" x2="${W - M.r}" y1="${yy}" y2="${yy}"/>`;
    const sides = [
      { anchor: 'end', x: W - M.r, x0: W - M.r - lw, x1: W - M.r },
      { anchor: 'start', x: M.l + 4, x0: M.l + 4, x1: M.l + 4 + lw }
    ];
    const score = sd => {
      let c = 0;
      spec.data.forEach((d, i) => {
        const bx0 = M.l + i * band, bx1 = bx0 + band;
        if (bx1 >= sd.x0 && bx0 <= sd.x1 && d.v > 0 && y(d.v) < ly + 2) c += 1;
      });
      for (const v of vlabels) if (v.x1 >= sd.x0 && v.x0 <= sd.x1 && Math.abs(v.y - ly) < 13) c += 10;
      return c;
    };
    const side = score(sides[0]) <= score(sides[1]) ? sides[0] : sides[1];
    g += `<text class="reflabel" x="${side.x}" y="${ly}" text-anchor="${side.anchor}">${esc(spec.ref.label)}</text>`;
  }
  spec.data.forEach((d, i) => {
    if (!d.xl) return;
    g += `<text class="xtick${spec.emphX === i ? ' em' : ''}" x="${M.l + i * band + band / 2}" y="${H - 6}" text-anchor="middle">${esc(d.xl)}</text>`;
  });
  for (const v of vlabels) g += `<text class="vlabel" x="${v.cx}" y="${v.y}" text-anchor="middle">${v.txt}</text>`;
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria)}" tabindex="0">${g}</svg><div class="tip" hidden></div>`;

}
function wireTip(host, spec, geo) {
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), bandEl = svg.querySelector('.band');
  let cur = -1;
  const hide = () => { cur = -1; tip.hidden = true; bandEl.setAttribute('visibility', 'hidden'); };
  const show = i => {
    if (!(i >= 0 && i < geo.n)) return hide();
    cur = i;
    const d = spec.data[i];
    bandEl.setAttribute('x', geo.M.l + i * geo.band);
    bandEl.setAttribute('width', geo.band);
    bandEl.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${esc(d.tipV)}</b><span>${esc(d.tipL)}</span>`;
    tip.hidden = false;
    const cx = geo.M.l + i * geo.band + geo.band / 2;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(cx - tw / 2, 0), geo.W - tw) + 'px';
  };
  const idxAt = e => {
    const r = svg.getBoundingClientRect();
    return Math.floor((e.clientX - r.left - geo.M.l) / geo.band);
  };
  svg.addEventListener('pointermove', e => show(idxAt(e)));
  svg.addEventListener('pointerdown', e => show(idxAt(e)));
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const step = e.key === 'ArrowRight' ? 1 : -1;
      const nx = cur < 0 ? (step > 0 ? 0 : geo.n - 1) : cur + step;
      show(Math.max(0, Math.min(geo.n - 1, nx)));
    } else if (e.key === 'Escape') hide();

}
function drawCharts() {

const XL_COL = 72, XL_ROW = 24, XL_GUTTER = 28;

}

let toastTimer = 0;
function toast(msg, opt = {}) {
  const el = $('#toast');

  span.textContent = msg;
  el.appendChild(span);
  if (opt.action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'toast-act';
    b.textContent = opt.action;
    b.addEventListener('click', () => { el.hidden = true; opt.onAction(); });

  }
  el.classList.toggle('error', opt.kind === 'error');

  commit({ rec: { [r.id]: r } }).then(ok => {
    if (!ok) return;
    toast(R.edit ? '고정 항목을 고쳤어요' : '고정 항목을 등록했어요');
    autoPost();
  });
}
function deleteRec() {
  const r = R.edit;
  if (!r) return;
  recSheet.close();
  commit({ rec: { [r.id]: null } }).then(ok => {
    if (ok) toast('고정 항목을 지웠어요. 이미 적힌 기록은 그대로 둬요.', { action: '되돌리기', onAction: () => commit({ rec: { [r.id]: r } }) });
  });
}

/* ================= 확인 · 복사 시트 ================= */
const cfSheet = $('#confirmSheet');
let cfResolve = null;
function confirmBox({ title, body, ok = '확인', danger = false }) {
  $('#cfTitle').textContent = title;
  $('#cfBody').textContent = body;
  const okBtn = $('#cfOk');
  okBtn.textContent = ok;
  okBtn.style.background = danger ? 'var(--bad)' : '';
  okBtn.style.borderColor = danger ? 'var(--bad)' : '';
  cfSheet.returnValue = '0';
  cfSheet.showModal();
  return new Promise(res => { cfResolve = res; });
}
cfSheet.addEventListener('close', () => { if (cfResolve) { cfResolve(cfSheet.returnValue === '1'); cfResolve = null; } });
cfSheet.addEventListener('click', e => {
  const b = e.target.closest('[data-cf]');
  if (b) cfSheet.close(b.dataset.cf);
});
cfSheet.addEventListener('cancel', () => { cfSheet.returnValue = '0'; });

function showCopy(text) {
  $('#cpText').value = text;
  $('#copySheet').showModal();
}
$('#cpBtn').addEventListener('click', () => {
  const ta = $('#cpText');
  const fallback = () => { ta.focus(); ta.select(); toast('선택했어요. 길게 눌러 복사하세요.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(() => toast('복사했어요'), fallback);
  } else fallback();
});

/* ================= 내보내기 · 불러오기 ================= */
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
function toCsv(list) {
  const head = ['날짜', '구분', '카테고리', '금액', '메모', 'N빵 총액', 'N빵 인원', '고정'];
  const rows = [...list].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.created - b.created)).map(t => [
    t.date, t.type === 'in' ? '수입' : '지출', catOf(t.cat, t.type).name, t.amount, t.memo,
    t.split ? t.split.total : '', t.split ? t.split.n : '', t.rid ? '예' : ''
  ]);
  return '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}
async function offerFile(filename, data, mime) {
  if (S.downloads) {
    try {
      await S.downloads.save({ filename, data });
      toast('파일을 저장했어요');
      return;
    } catch (e) {
      if (e && (e.code === 'declined' || e.code === 'rate_limited')) return;
    }
  }
  if (!window.claude) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: mime }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return;
    } catch (e) { /* 아래 복사로 */ }
  }
  showCopy(data);
}
function exportCsv(scope) {
  const cur = curYm();
  const list = scope === 'month' ? monthTx(cur) : allTx();
  if (!list.length) { toast('내보낼 기록이 없어요'); return; }
  offerFile(scope === 'month' ? `캠퍼스가계부_${cur}.csv` : `캠퍼스가계부_전체_${todayStr()}.csv`, toCsv(list), 'text/csv');
}
function exportJson() {
  const docs = {};
  for (const [id, d] of Object.entries(S.docs)) docs[id] = cleanDoc(d);
  const data = JSON.stringify({ app: 'campus-gagyebu', v: 1, exportedAt: new Date().toISOString(), docs }, null, 1);
  offerFile(`캠퍼스가계부_백업_${todayStr()}.json`, data, 'application/json');
}
function parseBackup(text) {
  const d = JSON.parse(text);
  if (!d || typeof d !== 'object' || !d.docs || typeof d.docs !== 'object') throw new Error('shape');
  const docs = {};
  let count = 0;
  for (const [id, doc] of Object.entries(d.docs)) {
    if (!doc || typeof doc !== 'object') continue;
    if (id === 'settings') {
      const s = normSettings(doc);
      const rec = {};
      for (const r of Object.values(s.recurring)) rec[r.id] = recDoc(r);
      docs.settings = { budget: s.budget, catBudgets: s.catBudgets, wage: s.wage, recurring: rec, since: s.since, exBudget: s.exBudget, exCat: s.exCat, skin: doc.skin === 'excel' || doc.skin === 'default' ? doc.skin : S.settings.skin };
    } else if (/^m-\d{4}-(0[1-9]|1[0-2])$/.test(id) && doc.tx && typeof doc.tx === 'object') {
      const tx = {};
      for (const [tid, raw] of Object.entries(doc.tx)) {
        const t = normTx(raw, tid);
        if (t && monthDoc(t.date.slice(0, 7)) === id) { tx[tid] = txDoc(t); count++; }
      }
      docs[id] = { tx };
    }
  }
  return { docs, count };
}
async function importFile(file) {
  let parsed;
  try { parsed = parseBackup(await file.text()); }
  catch (e) { toast('캠퍼스 가계부 백업 파일이 아니에요. 파일을 다시 골라 주세요.', { kind: 'error' }); return; }
  const ok = await confirmBox({
    title: '백업으로 바꿀까요?',
    body: `백업 파일의 기록 ${parsed.count}건과 설정으로 지금 가계부를 바꿔요. 지금 있는 기록 ${allTx().length}건은 사라져요.`,
    ok: '바꾸기',
    danger: true
  });
  if (!ok) return;
  if (!parsed.docs.settings) parsed.docs.settings = { skin: S.settings.skin };
  if (await replaceAll(parsed.docs)) toast(`백업을 불러왔어요 (${parsed.count}건)`);
  autoPost();
}
async function resetAll() {
  const ok = await confirmBox({
    title: '모든 기록을 지울까요?',
    body: `기록 ${allTx().length}건과 예산, 고정 항목이 모두 사라지고 되돌릴 수 없어요. 필요하면 먼저 백업 파일을 받아 두세요.`,
    ok: '모두 지우기',
    danger: true
  });
  if (!ok) return;
  if (await replaceAll(S.settings.skin !== 'default' ? { settings: { skin: S.settings.skin } } : {})) toast('모든 기록을 지웠어요');
}
function clearExamples() {
  const del = allTx().filter(t => t.ex);
  const rec = {};
  for (const r of Object.values(S.settings.recurring)) if (r.ex) rec[r.id] = null;
  const st = {};
  if (S.settings.exBudget) { st.budget = 0; st.exBudget = false; }
  if (S.settings.exCat) {
    st.catBudgets = Object.fromEntries(Object.keys(S.settings.catBudgets).map(k => [k, null]));
    st.exCat = false;
  }
  let since = todayStr();
  for (const t of allTx()) if (!t.ex && t.date < since) since = t.date;
  st.since = since;
  const ch = { del, settings: st };
  if (Object.keys(rec).length) ch.rec = rec;
  commit(ch).then(ok => { if (ok) toast('예시를 지웠어요. 이제 내 가계부를 시작해 볼까요?'); });
  go('home');
}

/* ================= 이벤트 ================= */
function findTx(id) { return allTx().find(t => t.id === id) || null; }

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { blurTyping(); go(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a !== 'ob-preset') blurTyping();
  switch (a) {
    case 'add': {
      const date = ui.tab === 'list' && ui.listMode === 'cal' && ui.calSel && ui.calSel.startsWith(ui.month) ? ui.calSel : null;
      openTx({ date });
      break;
    }
    case 'edit-tx': { const t = findTx(el.dataset.id); if (t) openTx({ tx: t }); break; }
    case 'cal-add': openTx({ date: el.dataset.date }); break;
    case 'cal-pick': ui.calSel = el.dataset.date; render(); break;
    case 'month-prev': ui.month = addMonths(ui.month, -1); ui.calSel = null; render(); break;
    case 'month-next': ui.month = addMonths(ui.month, 1); ui.calSel = null; render(); break;
    case 'month-now': ui.month = curYm(); ui.calSel = null; render(); break;
    case 'list-mode': ui.listMode = el.dataset.mode; saveUi(); render(); break;
    case 'flt-type': ui.fType = el.dataset.v; render(); break;
    case 'stats-type': ui.sType = el.dataset.v; render(); break;
    case 'toggle-table': ui.tables[el.dataset.id] = !ui.tables[el.dataset.id]; render(); break;
    case 'goto-list': ui.month = curYm(); ui.listMode = 'list'; ui.fType = 'all'; ui.fCat = ''; ui.q = ''; saveUi(); go('list'); break;
    case 'goto-stats': ui.month = curYm(); go('stats'); break;
    case 'goto-settings': go('settings'); break;
    case 'goto-cat': {
      const c = CAT[el.dataset.cat];
      ui.month = el.dataset.month || ui.month;
      ui.listMode = 'list';
      ui.fCat = c ? c.id : '';
      ui.fType = c ? c.type : 'all';
      ui.q = '';
      saveUi();
      go('list');
      break;
    }
    case 'ob-preset': { const inp = $('#ob-budget'); if (inp) inp.value = won(Number(el.dataset.v)); break; }
    case 'save-onboard': {
      const v = parseAmount($('#ob-budget') && $('#ob-budget').value);
      if (!v) { const err = $('#obErr'); if (err) err.textContent = '한 달 예산을 넣어 주세요.'; return; }
      commit({ settings: { budget: v, exBudget: false, since: S.settings.since || todayStr() } }).then(ok => ok && toast('예산을 정했어요. 오늘 쓴 돈부터 적어 볼까요?'));
      break;
    }
    case 'save-budget': {
      const v = parseAmount($('#set-budget').value);
      commit({ settings: { budget: v, exBudget: false, since: S.settings.since || todayStr() } }).then(ok => ok && toast(v ? '월 예산을 저장했어요' : '월 예산을 지웠어요'));
      break;
    }
    case 'save-cats': {
      const patch = {};
      for (const c of CATS.out) {
        const inp = $('#cb-' + c.id);
        if (!inp) continue;
        const v = parseAmount(inp.value);
        if (v) patch[c.id] = v;
        else if (S.settings.catBudgets[c.id]) patch[c.id] = null;
      }
      commit({ settings: { catBudgets: patch, exCat: false } }).then(ok => ok && toast('카테고리 예산을 저장했어요'));
      break;
    }
    case 'save-wage': {
      const v = parseAmount($('#set-wage').value);
      if (!v) { toast('시급을 넣어 주세요', { kind: 'error' }); return; }
      commit({ settings: { wage: v } }).then(ok => ok && toast('시급을 저장했어요'));
      break;
    }
    case 'set-skin': {
      const v = el.dataset.v === 'excel' ? 'excel' : 'default';
      if (v === S.settings.skin && v === ui.skin) break;
      applySkin(v);
      commit({ settings: { skin: v } }).then(ok => ok && toast(v === 'excel' ? '엑셀 테마로 바꿨어요' : '기존 테마로 바꿨어요'));
      break;
    }
    case 'add-rec': openRec(null); break;
    case 'edit-rec': { const r = S.settings.recurring[el.dataset.id]; if (r) openRec(r); break; }
    case 'export-csv': exportCsv(el.dataset.scope); break;
    case 'export-json': exportJson(); break;
    case 'import-json': $('#importFile').click(); break;
    case 'clear-examples': clearExamples(); break;
    case 'reset-all': resetAll(); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('money-in')) formatMoneyInput(el);
  if (el.id === 'flt-q') {
    ui.q = el.value;
    const box = $('#listResults');
    if (box) box.innerHTML = listResultsHtml();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'flt-cat') {
    ui.fCat = el.value;
    if (el.value && CAT[el.value]) ui.fType = CAT[el.value].type;
    el.blur();
    pendingRender = false;
    doRender();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target && e.target.id;
  if (id === 'ob-budget') { e.preventDefault(); $('[data-action="save-onboard"]').click(); }
  else if (id === 'set-budget') { e.preventDefault(); $('[data-action="save-budget"]').click(); }
  else if (id === 'flt-q') { e.preventDefault(); e.target.blur(); }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) importFile(f);
});

/* 기록 시트 */
const txForm = $('#txForm');
txForm.addEventListener('submit', submitTx);
txForm.addEventListener('click', e => {
  const typeBtn = e.target.closest('[data-type]');
  if (typeBtn) {
    if (T.type !== typeBtn.dataset.type) {
      T.type = typeBtn.dataset.type;
      if (T.cat && CAT[T.cat].type !== T.type) T.cat = null;
      T.split = false;
      $('#txErr').textContent = '';
      syncTx();
    }
    return;
  }
  const catBtn = e.target.closest('[data-cat]');
  if (catBtn) {
    T.cat = catBtn.dataset.cat;
    $('#txErr').textContent = '';
    syncTx();
    const again = $(`#catGrid [data-cat="${T.cat}"]`);
    if (again) again.focus({ preventScroll: true });
    if (T.type === 'in' && T.cat === 'parttime') updateWage();
    return;
  }
  const add = e.target.closest('[data-add]');
  if (add) {
    const inc = Number(add.dataset.add);
    const v = inc ? parseAmount($('#f-amount').value) + inc : 0;
    $('#f-amount').value = v ? won(v) : '';
    updateSplitInfo();
    return;
  }
  const nBtn = e.target.closest('[data-n]');
  if (nBtn) {
    T.n = Math.max(2, Math.min(30, T.n + Number(nBtn.dataset.n)));
    $('#splitN').textContent = T.n;
    updateSplitInfo();
    return;
  }
  const dq = e.target.closest('[data-date-q]');
  if (dq) { $('#f-date').value = addDays(todayStr(), Number(dq.dataset.dateQ)); return; }
  const qp = e.target.closest('[data-qp]');
  if (qp) {
    const p = T.picks[Number(qp.dataset.qp)];
    if (!p) return;
    T.cat = p.cat;
    T.split = false;
    $('#f-amount').value = won(p.amount);
    $('#f-memo').value = p.memo;
    $('#txErr').textContent = '';
    syncTx();
    $('#txSave').focus({ preventScroll: true });
  }
});
$('#f-split').addEventListener('change', e => {
  T.split = e.target.checked;
  $('#splitCtl').hidden = !T.split;
  $('#amountLabel').textContent = T.split ? '모두 함께 낸 돈' : '쓴 돈';
  updateSplitInfo();
});
$('#f-amount').addEventListener('input', updateSplitInfo);
$('#f-amount').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
$('#f-hours').addEventListener('input', updateWage);
$('#f-wage').addEventListener('input', updateWage);
$('#txDelete').addEventListener('click', deleteTx);

/* 고정 항목 시트 */
const recForm = $('#recForm');
recForm.addEventListener('submit', submitRec);
recForm.addEventListener('click', e => {
  const tb = e.target.closest('[data-rtype]');
  if (!tb || R.type === tb.dataset.rtype) return;
  R.type = tb.dataset.rtype;
  for (const b of $$('#recType [data-rtype]')) b.setAttribute('aria-checked', String(b.dataset.rtype === R.type));
  fillRecCats();
  $('#r-cat').value = R.type === 'in' ? 'allowance' : 'housing';
});
$('#r-day').innerHTML = Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}">${i + 1 === 31 ? '31일 (말일)' : `${i + 1}일`}</option>`).join('');
$('#r-day').addEventListener('change', syncRecNow);
$('#recDelete').addEventListener('click', deleteRec);

/* 시트 공통: 닫기 버튼, 바깥 누르면 닫기 */
for (const d of $$('dialog.sheet')) {
  d.addEventListener('click', e => {
    if (e.target === d) d.close();
    else if (e.target.closest('[data-close]')) d.close();
  });
}

/* ================= 시작 ================= */
let lastToday = todayStr();
function tick() {
  const t = todayStr();
  if (t === lastToday) return;
  const prevYm = lastToday.slice(0, 7);
  lastToday = t;
  if (ui.month === prevYm) ui.month = t.slice(0, 7);
  S.rev++;
  render();
  autoPost();
}
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

applySkin(ui.skin);
render();
connect();
})();
</script>
