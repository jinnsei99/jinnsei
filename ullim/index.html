<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>울림 스튜디오 — 새 주소로 이사했어요</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17181b">
<link rel="canonical" href="https://jinnsei99.github.io/ullim/">
<noscript><meta http-equiv="refresh" content="0; url=https://jinnsei99.github.io/ullim/"></noscript>
<script>
// 울림 스튜디오는 2026-11-10에 https://jinnsei99.github.io/ullim/ (저장소 jinnsei99/ullim)로 이사했다.
// 이 페이지는 옛 주소 /jinnsei/ullim/ 의 북마크와 홈 화면 앱을 새 주소로 넘긴다.
// 넘기기 전에 옛 주소의 서비스 워커 등록을 풀고 옛 주소 파일만 담긴 캐시를 지운다(새 주소의 캐시는 남긴다).
// 같은 사이트(origin)라 프로젝트(IndexedDB)와 설정(localStorage)은 그대로 새 주소에서 보인다. 그래서 그것들은 건드리지 않는다.
(function () {
  var target = location.origin + '/ullim/' + location.search + location.hash;
  var here = new URL('./', location.href).href; // 이 폴더(옛 주소) — 끝에 / 가 붙는다
  var go = function () { location.replace(target); };

  function cleanup() {
    var jobs = [];
    if ('serviceWorker' in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.filter(function (r) { return r.scope === here; })
          .map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches) {
      jobs.push(caches.keys().then(function (names) {
        return Promise.all(names.filter(function (n) { return n.indexOf('ullim-') === 0; }).map(function (name) {
          return caches.open(name).then(function (cache) { return cache.keys(); }).then(function (reqs) {
            var inOld = function (r) { return r.url.indexOf(here) === 0; };
            var otherSite = function (r) { return new URL(r.url).origin !== location.origin; }; // 글꼴 저장본
            var onlyOld = reqs.some(inOld) && reqs.every(function (r) { return inOld(r) || otherSite(r); });
            return onlyOld ? caches.delete(name) : false;
          });
        }));
      }));
    }
    return Promise.all(jobs);
  }

  var timer = setTimeout(go, 1500); // 정리가 늦어도 1.5초 뒤에는 넘어간다
  try {
    cleanup().then(function () { clearTimeout(timer); go(); }, function () { clearTimeout(timer); go(); });
  } catch (e) { clearTimeout(timer); go(); }
})();
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17181b; color: #e8e8ea;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 32rem; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  a { color: #ffb84d; word-break: break-all; }
  p { margin: 0 0 12px; }
  .small { color: #a0a0a8; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>울림 스튜디오가 새 주소로 이사했어요</h1>
  <p><a href="https://jinnsei99.github.io/ullim/">https://jinnsei99.github.io/ullim/</a></p>
  <p>잠시 뒤 자동으로 넘어가요. 넘어가지 않으면 위 주소를 눌러 주세요.</p>
  <p class="small">이 브라우저에 저장한 프로젝트는 새 주소에서도 그대로 보여요. 아이패드 홈 화면에 추가했던 앱은 새 주소에서 다시 추가하고, 예전 앱에서 받아 둔 프로젝트 파일(.ullim.json)을 열어 옮겨 주세요.</p>
</main>
</body>
</html>
