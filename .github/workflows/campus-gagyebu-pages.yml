# campus-gagyebu/ 폴더를 GitHub Pages에 올린다.
# 처음 한 번은 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 한다.
# 그 전에는 배포를 건너뛰고 안내만 남긴다.
name: 캠퍼스 가계부 배포

on:
  push:
    branches: [main]
    paths:
      - 'campus-gagyebu/**'
      - '.github/workflows/campus-gagyebu-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: GitHub Pages 설정 확인
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>err.txt)
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "::notice title=배포 건너뜀::Pages 배포 방식이 '${build_type}'예요. Settings → Pages → Source를 'GitHub Actions'로 바꾼 뒤 이 워크플로를 다시 실행하세요."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" err.txt; then
            echo "::notice title=배포 건너뜀::GitHub Pages가 아직 꺼져 있어요. Settings → Pages → Source를 'GitHub Actions'로 바꾼 뒤 이 워크플로를 다시 실행하세요."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat err.txt
            exit 1
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: campus-gagyebu
      - id: deployment
        uses: actions/deploy-pages@v4
